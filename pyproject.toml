[project]
name = "Flask-WhooshPeewee"
version = "0.0.1"
dependencies = [
    "flask>=3.1.3",
    "peewee>=4.5.1",
    "whoosh>=2.7.4"
]
[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "mkdocs>=1.6.1",
    "mkdocstrings>=2.0.8",
    "mkdocstrings>=1.0.6"
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
